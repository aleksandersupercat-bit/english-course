<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#c92a3e"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Первые слова"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>Первые слова · Английский</title><meta name="description" content="Учим 14 английских слов: выбираем перевод и тренируем письмо."><style>:root{font-family:Arial,Helvetica,sans-serif;color:#33242a;background:#fff7f7;--red:#c92a3e}*{box-sizing:border-box}body{margin:0}main{max-width:800px;margin:auto;padding:28px 24px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px;gap:12px}.brand{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;font-size:21px;font-weight:800}.logo{background:var(--red);color:white;border-radius:16px;padding:14px;font-size:24px}.brand small{display:block;font-size:12px;letter-spacing:2px;margin-top:5px;color:#9b5963}.set{font-size:14px;color:#875a62}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}nav button{border:1px solid #f0cdd2;background:white;border-radius:16px;padding:15px 8px;color:#78525a;font-size:15px;line-height:1.5}nav button.active{background:var(--red);color:white;border-color:var(--red)}nav b{display:block;font-size:20px}section{background:white;border:1px solid #f4d9dd;border-radius:28px;padding:32px;box-shadow:0 12px 40px #ae233509}.topline{display:flex;justify-content:space-between;color:#8c6068;font-size:14px;margin-bottom:12px}.track{height:8px;background:#fae8eb;border-radius:10px;overflow:hidden}.fill{height:100%;background:var(--red);transition:width .3s}h1{font-size:23px;text-align:center;margin:30px 0 8px}p{text-align:center;color:#805d65;font-size:16px;line-height:1.5}.word{text-align:center;font-size:clamp(42px,9vw,64px);font-weight:800;letter-spacing:1px;margin:30px 0;color:var(--red);overflow-wrap:anywhere}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{min-height:72px;background:white;border:2px solid #f0d4d9;border-radius:18px;color:#422b32;font-size:22px;font-weight:700;padding:12px}.answer:hover{background:#fff3f5;border-color:#dc8794}.answer.wrong{border-color:#c92a3e;background:#fff0f2}.answer.correct{border-color:#36865a;background:#eff8f2;color:#246540}.answer:disabled{cursor:default;opacity:1}.feedback{min-height:52px;text-align:center;font-size:18px;font-weight:700;padding:17px 0;color:#8a3342}.primary{display:block;background:var(--red);color:white;border:0;border-radius:16px;min-height:56px;width:100%;font-weight:700;font-size:19px;padding:14px}.primary:disabled{background:#e4b7bf;cursor:default}input{width:100%;border:2px solid #e9bac3;border-radius:16px;padding:18px;font-size:26px;text-align:center;outline:none}input:focus{border-color:var(--red);box-shadow:0 0 0 4px #fbe7eb}button:focus-visible,a:focus-visible{outline:3px solid #5a56b3;outline-offset:4px}.result{text-align:center;padding:20px 0}.badge{display:inline-flex;background:#ffe9ed;color:var(--red);height:90px;width:90px;align-items:center;justify-content:center;font-size:44px;border-radius:50%}.result h1{font-size:30px}.result .primary{margin-top:24px}.restart{border:0;background:none;color:var(--red);padding:18px;font-size:16px;width:100%}footer{text-align:center;color:#9b6d76;font-size:14px;margin:26px 0}@media(max-width:520px){main{padding:20px 14px}.brand{font-size:18px}.logo{padding:11px}.set{max-width:76px;line-height:1.5}header{margin-bottom:24px}nav{gap:6px}nav button{font-size:13px;padding:10px 4px}section{padding:24px 18px;border-radius:22px}.answer{font-size:20px;min-height:70px}h1{font-size:21px}.word{margin:28px 0}.answers{gap:10px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.slots{display:flex;justify-content:center;gap:5px;margin:8px 0 24px}.slot{flex:0 1 40px;min-width:0;height:48px;border-bottom:3px solid #d998a4;font-size:30px;font-weight:700;text-align:center;color:#ba2037;line-height:44px}.slot.filled{border-color:#c92a3e}.slots.success .slot{color:#246540;border-color:#36865a}.slots.incorrect .slot{background:#fff0f2}.letters{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.letter{min-height:56px;border:2px solid #f0cdd2;background:#fff7f8;color:#a91930;border-radius:14px;font-size:27px;font-weight:700;touch-action:manipulation}.letter:active{background:#f9dce2}.letter:disabled{opacity:.45;cursor:default}.erase{display:block;margin:14px auto 0;min-height:44px;border:0;background:none;color:#a91930;font-size:16px}.erase:disabled{opacity:.4}@media(max-width:360px){.slot{font-size:26px}.letters{gap:6px}.letter{min-height:50px}} .set-button{border:1px solid #e9bac3;background:#fff;color:#9b3345;border-radius:12px;padding:9px 12px;font:inherit;font-weight:700}.set-panel{position:fixed;z-index:30;top:16px;right:16px;width:min(360px,calc(100% - 32px));max-height:calc(100dvh - 32px);overflow:auto;background:#fff;border:1px solid #f0cdd2;border-radius:20px;padding:16px;box-shadow:0 18px 50px #5b172330}.set-panel[hidden],.add-form[hidden]{display:none}.set-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.set-panel h2{font-size:19px;margin:0}.panel-close,.add-toggle{border:0;background:#ffe9ed;color:#b21f36;border-radius:10px;font-size:22px;line-height:32px;width:32px;height:32px}.word-list{list-style:none;padding:0;margin:14px 0;display:grid;gap:7px}.word-list li{display:flex;justify-content:space-between;gap:12px;padding:9px 10px;background:#fff7f8;border-radius:10px}.word-list li span:last-child{color:#805d65;text-align:right}.add-form{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;border-top:1px solid #f3dbe0;padding-top:12px}.add-form input{min-width:0;font-size:16px;padding:10px;text-align:left;border-radius:10px}.add-form button{border:0;border-radius:10px;background:var(--red);color:#fff;width:38px;font-size:22px;font-weight:700}@media(max-width:520px){.set{max-width:none}.add-form{grid-template-columns:1fr 1fr auto}}.header-actions{display:flex;align-items:center;gap:8px}.sound-toggle{width:38px;height:38px;border:1px solid #e9bac3;background:#fff;border-radius:12px;font-size:19px;line-height:1;padding:0}.sound-toggle[aria-pressed="false"]{filter:grayscale(1);opacity:.7}</style></head><body><main><header><a class="brand" href="#"><span class="logo">Aa</span><span>Первые слова<small>АНГЛИЙСКИЙ</small></span></a><span class="header-actions"><button class="sound-toggle" id="sound-toggle" type="button" aria-label="Выключить звук" title="Выключить звук">🔊</button><button class="set set-button" id="set-button" type="button" aria-expanded="false">Набор</button></span></header><nav aria-label="Этапы обучения" id="stages"></nav><section id="lesson" aria-labelledby="title"></section><footer>Маленькие шаги — большие открытия</footer></main><aside class="set-panel" id="set-panel" hidden aria-label="Набор слов"><div class="set-panel-head"><h2>Набор слов</h2><button class="add-toggle" id="add-toggle" type="button" aria-label="Добавить слово">+</button><button class="panel-close" id="panel-close" type="button" aria-label="Закрыть">×</button></div><ul class="word-list" id="word-list"></ul><form class="add-form" id="add-form" hidden><input id="new-word-en" lang="en" maxlength="30" placeholder="cat" autocomplete="off" required><input id="new-word-ru" maxlength="40" placeholder="кошка" autocomplete="off" required><button type="submit" aria-label="Добавить слово">+</button></form></aside><script>const defaultWords=[['cat','кошка'],['dog','собака'],['bed','кровать'],['ant','муравей'],['egg','яйцо'],['flag','флаг'],['glass','стакан'],['horse','лошадь'],['ink','чернила'],['jug','кувшин'],['kangaroo','кенгуру'],['lamp','лампа'],['nest','гнездо'],['orange','апельсин']];const wordKey=value=>String(value).trim().toLowerCase();const defaultKeys=new Set(defaultWords.map(([en])=>wordKey(en)));const savedWords=(()=>{try{const value=JSON.parse(localStorage.getItem('firstWordsCustom')||'[]');const seen=new Set(defaultKeys);const merged=Array.isArray(value)?value.filter(item=>Array.isArray(item)&&item.length===2&&item.every(part=>typeof part==='string')).map(([en,ru])=>[wordKey(en),ru.trim()]).filter(([en,ru])=>en&&ru&&!seen.has(en)&&(seen.add(en),true)):[];localStorage.setItem('firstWordsCustom',JSON.stringify(merged));return merged;}catch{return[]}})();const words=[...defaultWords,...savedWords];
const names=['Выбери перевод','Найди слово','Собери слово'];
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
let stage=0,order=[],pos=0,firstTry=0,hadError=false,solved=false,totalScores=[null,null,null];
const lesson=document.querySelector('#lesson'),nav=document.querySelector('#stages');
function navigation(){nav.innerHTML=names.map((n,i)=>`<button class="${i===stage?'active':''}" ${i===stage?'aria-current="step"':''} data-stage="${i}"><b>${totalScores[i]!==null?'✓ ':''}${i+1}</b>${n}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>start(+b.dataset.stage,true));}
function start(s,scrollToLesson=false){stage=s;order=shuffle(words);pos=0;firstTry=0;navigation();render();if(scrollToLesson){requestAnimationFrame(()=>lesson.scrollIntoView({behavior:'smooth',block:'start'}));}}
function render(){hadError=false;solved=false;const w=order[pos];lesson.innerHTML=`<div class="topline"><span>Этап ${stage+1} из 3</span><span>Слово ${pos+1} из ${words.length}</span></div><div class="track" role="progressbar" aria-label="Прогресс этапа" aria-valuemin="0" aria-valuemax="14" aria-valuenow="${pos}"><div class="fill" style="width:${pos/words.length*100}%"></div></div><h1 id="title">${names[stage]}</h1><p>${stage===0?'Что значит это слово?':stage===1?'Как это слово пишется по-английски?':'Как это будет по-английски? Нажимай на буквы.'}</p><div class="word" lang="${stage>0?'ru':'en'}">${w[stage>0?1:0]}</div>${stage===2?'<div id="slots" class="slots" role="group" aria-label="Буквы ответа"></div><div id="letters" class="letters" aria-label="Выбери буквы"></div><button id="erase" class="erase">Стереть букву</button><div class="feedback" role="status" aria-live="polite" id="feedback"></div><button class="primary" id="check" disabled>Проверить</button>':'<div class="answers" id="answers"></div><div class="feedback" role="status" aria-live="polite" id="feedback"></div>'}<button class="primary" id="next" hidden>Следующее слово</button>`;
const next=document.querySelector('#next');next.style.display='none';next.onclick=()=>{if(!solved)return;pos++;if(pos===words.length)finish();else render();};
if(stage<2){let choices=shuffle([w,...shuffle(words.filter(x=>x!==w)).slice(0,3)]);const box=document.querySelector('#answers');choices.forEach(c=>{const b=document.createElement('button');b.className='answer';b.textContent=c[stage===0?1:0];if(stage===1)b.lang='en';b.onclick=()=>{if(solved)return;if(c===w){b.classList.add('correct');accept();box.querySelectorAll('button').forEach(x=>x.disabled=true);}else{hadError=true;b.classList.add('wrong');b.disabled=true;document.querySelector('#feedback').textContent='Попробуй ещё раз. Ты справишься!';}};box.append(b);}); }else{
const slots=document.querySelector('#slots'),letters=document.querySelector('#letters'),check=document.querySelector('#check'),erase=document.querySelector('#erase');
let typed='';
function update(){slots.innerHTML=Array.from(w[0],(_,i)=>`<span class="slot ${typed[i]?'filled':''}" lang="en" aria-label="${typed[i]||'Пустое место'}">${typed[i]||'_'}</span>`).join('');check.disabled=typed.length!==w[0].length;erase.disabled=!typed.length;letters.querySelectorAll('button').forEach(b=>b.disabled=solved||typed.length===w[0].length);}
letterChoices(w[0]).forEach(letter=>{const b=document.createElement('button');b.className='letter';b.lang='en';b.textContent=letter;b.onclick=()=>{if(solved||typed.length===w[0].length)return;speakLetter(letter);typed+=letter;document.querySelector('#feedback').textContent='';slots.classList.remove('incorrect');update();};letters.append(b);});
erase.onclick=()=>{if(solved)return;typed=typed.slice(0,-1);document.querySelector('#feedback').textContent='';slots.classList.remove('incorrect');update();};
check.onclick=()=>{if(solved||typed.length!==w[0].length)return;if(typed===w[0]){accept();check.hidden=true;check.style.display='none';erase.disabled=true;slots.classList.add('success');letters.querySelectorAll('button').forEach(b=>b.disabled=true);}else{hadError=true;slots.classList.add('incorrect');document.querySelector('#feedback').textContent='Пока не получилось. Исправь буквы и попробуй ещё раз.';}};
update();}}
function letterChoices(word){const required=[...new Set(word)];const extra=shuffle([...'abcdefghijklmnopqrstuvwxyz'].filter(c=>!required.includes(c))).slice(0,10-required.length);return shuffle([...required,...extra]);}

function accept(){solved=true;if(!hadError)firstTry++;document.querySelector('#feedback').textContent='Верно! Молодец!';const next=document.querySelector('#next');next.hidden=false;next.style.display='block';next.textContent=pos===words.length-1?'Завершить этап':'Следующее слово';}
function finish(){totalScores[stage]=firstTry;navigation();const all=totalScores.every(x=>x!==null);lesson.innerHTML=`<div class="result"><div class="badge" aria-hidden="true">★</div><h1 id="title">${all?'Все три этапа пройдены!':'Этап пройден!'}</h1><p>Все 14 слов позади. Отличная работа!</p><p>С первого раза: <strong>${firstTry} из 14</strong><br>Каждая попытка помогает учиться.</p><button class="primary" id="continue">${stage<2?'Перейти к этапу '+(stage+2):'Пройти курс ещё раз'}</button><button class="restart" id="repeat">Повторить этот этап</button></div>`;document.querySelector('#continue').onclick=()=>{if(stage<2)start(stage+1);else{totalScores=[null,null,null];start(0);}};document.querySelector('#repeat').onclick=()=>start(stage);}
function setupWordSet(){const setButton=document.querySelector('#set-button'),panel=document.querySelector('#set-panel'),list=document.querySelector('#word-list'),toggle=document.querySelector('#add-toggle'),close=document.querySelector('#panel-close'),form=document.querySelector('#add-form'),english=document.querySelector('#new-word-en'),russian=document.querySelector('#new-word-ru');const renderList=()=>{list.innerHTML=words.map(([en,ru])=>'<li><b lang="en">'+en+'</b><span>'+ru+'</span></li>').join('');};const closePanel=()=>{panel.hidden=true;setButton.setAttribute('aria-expanded','false');};setButton.onclick=()=>{panel.hidden=!panel.hidden;setButton.setAttribute('aria-expanded',String(!panel.hidden));if(!panel.hidden)renderList();};close.onclick=closePanel;toggle.onclick=()=>{form.hidden=!form.hidden;if(!form.hidden)english.focus();};form.onsubmit=event=>{event.preventDefault();const en=english.value.trim().toLowerCase();const ru=russian.value.trim();if(!/^[a-z]+$/.test(en)||!ru)return;if(words.some(([word])=>wordKey(word)===en)){english.setCustomValidity('Это слово уже есть в наборе');english.reportValidity();english.setCustomValidity('');return;}const added=[en,ru];words.push(added);savedWords.push(added);localStorage.setItem('firstWordsCustom',JSON.stringify(savedWords));english.value='';russian.value='';form.hidden=true;renderList();totalScores=[null,null,null];start(0);};}
let soundEnabled=(()=>{try{return localStorage.getItem('firstWordsSound')!=='off'}catch{return true}})();
function speakLetter(letter){if(!soundEnabled||!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const voice=new SpeechSynthesisUtterance(letter);voice.lang='en-US';voice.rate=.78;window.speechSynthesis.speak(voice);}
function setupSoundToggle(){const button=document.querySelector('#sound-toggle');const update=()=>{button.textContent=soundEnabled?'🔊':'🔇';button.setAttribute('aria-pressed',String(soundEnabled));const label=soundEnabled?'Выключить звук':'Включить звук';button.setAttribute('aria-label',label);button.title=label;};button.onclick=()=>{soundEnabled=!soundEnabled;try{localStorage.setItem('firstWordsSound',soundEnabled?'on':'off')}catch{}if(!soundEnabled&&'speechSynthesis' in window)window.speechSynthesis.cancel();update();};update();}
setupSoundToggle();
setupWordSet();
start(0);
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));}</script><script>
let installPrompt;
window.addEventListener('beforeinstallprompt', event => {
  event.preventDefault();
  installPrompt = event;
  const button = document.querySelector('#install-app');
  if (button) button.hidden = false;
});
window.addEventListener('appinstalled', () => {
  const button = document.querySelector('#install-app');
  if (button) button.hidden = true;
});
window.addEventListener('load', () => {
  const isInstalled = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (isInstalled) return;
  const button = document.createElement('button');
  button.id = 'install-app';
  button.className = 'primary';
  button.hidden = true;
  button.textContent = 'Установить приложение';
  button.style.cssText = 'position:fixed;z-index:10;left:24px;right:24px;bottom:16px;max-width:752px;margin:auto;width:calc(100% - 48px);box-shadow:0 8px 24px #7b142a55';
  document.body.style.paddingBottom = '92px';
  button.onclick = async () => {
    if (!installPrompt) return;
    installPrompt.prompt();
    await installPrompt.userChoice;
    installPrompt = null;
    button.hidden = true;
  };
  document.body.append(button);
});
</script></body></html>
